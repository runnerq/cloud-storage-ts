name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      # The hosted end-to-end test is skipped here: it needs a data plane.
      - run: npm test
        timeout-minutes: 3
      - run: npm pack --dry-run

  spec:
    # The protocol types are generated from the pinned runnerq-spec submodule.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: spec/go.mod
      - run: npm run spec:gen && git diff --exit-code
